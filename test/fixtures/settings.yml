# Mirrors db/seeds.rb so app code that calls Setting.get(key) sees the same
# keys/categories/input_types in tests as it would in a freshly seeded app.

crawl_default_radius_miles:
  key: crawl_default_radius_miles
  value: "100"
  category: crawl
  label: Default search radius (miles)
  input_type: number

crawl_max_retries:
  key: crawl_max_retries
  value: "3"
  category: crawl
  label: Max retries per page
  input_type: number

crawl_delay_between_requests_ms:
  key: crawl_delay_between_requests_ms
  value: "2000"
  category: crawl
  label: Delay between requests (milliseconds)
  input_type: number

crawl_headless:
  key: crawl_headless
  value: "true"
  category: crawl
  label: Run browser in headless mode (invisible)
  input_type: boolean

crawl_parallel_companies:
  key: crawl_parallel_companies
  value: "2"
  category: crawl
  label: Max companies to crawl simultaneously
  input_type: number

schedule_enabled:
  key: schedule_enabled
  value: "false"
  category: schedule
  label: Enable scheduled automatic crawls
  input_type: boolean

schedule_cron:
  key: schedule_cron
  value: "0 6 * * *"
  category: schedule
  label: Schedule (cron format)
  input_type: text

schedule_city:
  key: schedule_city
  value: ""
  category: schedule
  label: City to search on schedule
  input_type: text

schedule_radius_miles:
  key: schedule_radius_miles
  value: "100"
  category: schedule
  label: Radius to use on scheduled crawl (miles)
  input_type: number

