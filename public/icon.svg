<!--
  WHAT IS THIS FILE?
  This is a plain SVG (Scalable Vector Graphics) image — a picture
  described as text/XML markup (shapes with math coordinates) rather than
  as a grid of pixels like a .png or .jpg. Because it's vector-based, it
  can be scaled up or down to any size without getting blurry or pixelated.

  Files placed in Rails' public/ directory (like this one) are served by
  the web server at a URL matching their filename — this file is reachable
  at /icon.svg — with no Ruby/controller code involved. That's the standard
  place to put a favicon (the small icon a browser can show in a tab,
  bookmarks list, or mobile home-screen shortcut) in a default Rails 8 app,
  which is presumably this file's intended purpose, alongside the sibling
  public/icon.png (a pre-rendered pixel version, used for contexts that
  don't support SVG). That said, as of this comment pass, nothing found in
  the app's views/layouts actually links to /icon.svg via a `<link
  rel="icon">` tag or similar — see this repo's separate comment-pass
  report for a note on that.

  WHY IS IT A STATIC FILE INSTEAD OF SOMETHING GENERATED BY RAILS?
  A favicon is requested directly by the browser (at a fixed, predictable
  URL) on essentially every page load, completely separately from normal
  page navigation. It never needs any dynamic/per-request data, so there's
  no reason to route it through the app at all — Rails' web server just
  hands back this file byte-for-byte from the public/ directory, which is
  both faster and simpler than generating it dynamically. This is also why
  it still works even if the rest of the Rails app is broken or crashed,
  same reasoning as the public/*.html error pages in this same directory.

  This file uses plain HTML/XML-style comment syntax (the same markers
  wrapping this very paragraph) since SVG is an XML-based format with no
  embedded Ruby/ERB in it. Note for anyone editing this file later: unlike
  HTML5, strict XML (which real SVG files are) does NOT allow two
  consecutive hyphen characters inside a comment's body — only as the
  opening/closing delimiters themselves — so avoid typing that character
  pair inside SVG comment text, or XML validators/tooling can reject the
  file.
-->

<!-- The root <svg> element. `width` and `height` set the image's natural
     pixel dimensions (512x512 here — a common "high-res" favicon size that
     browsers/OSes can downscale as needed for smaller display contexts).
     `xmlns` (XML Namespace) declares that the tags in this file should be
     interpreted using the standard SVG vocabulary — without it, a strict
     XML parser wouldn't know what an <svg>/<circle> tag is supposed to
     mean. -->
<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- Draws a single filled circle — the entire "icon" is just this one
       shape. `cx`/`cy` set the center point's x/y coordinates (256, 256 —
       i.e. dead center of the 512x512 canvas declared above). `r` sets the
       radius in pixels (256, meaning the circle's edge just touches all
       four sides of the canvas, filling it edge-to-edge). `fill="red"` is
       a CSS/SVG named color, painting the whole circle solid red. -->
  <circle cx="256" cy="256" r="256" fill="red"/>
<!-- `</svg>` closes the root `<svg>` element opened above — this is the
     last tag in the file, matching the first. -->
</svg>
